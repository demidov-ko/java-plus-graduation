spring:
  cloud:
    config:
      enabled: false      # отключает резолвер configserver: — импорт игнорируется
  datasource:
    url: jdbc:postgresql://localhost:6541/ewm-stats
    username: stat
    password: stat
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

eureka:
  client:
    enabled: false
