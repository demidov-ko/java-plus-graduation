x-java-opts: &java-opts "JAVA_OPTS=-Xms64m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

# Общий healthcheck для всех БД
x-db-healthcheck: &db-healthcheck
  test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
  timeout: 5s
  interval: 5s
  retries: 10

services:
  # ---------- Инфраструктура ----------
  discovery-server:
    build: infra/discovery-server
    image: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  config-server:
    build: infra/config-server
    image: config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - *java-opts
      - SERVER_PORT=8888
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - CONFIG_REPO_PATH=/config-repo
    volumes:
      - ./infra/config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8888/application/default || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  gateway-server:
    build: infra/gateway-server
    image: gateway-server
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - *java-opts
      - EUREKA_URL=http://discovery-server:8761/eureka/
    restart: on-failure

  # ---------- Сервисы ----------
  stat-server:
    build: stat/stats-server
    image: stats-server
    depends_on:
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      - *java-opts
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://stats-db:5432/ewm-stats
    restart: on-failure

  user-service:
    build: core/user-service
    image: user-service
    depends_on:
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      - *java-opts
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://user-db:5432/ewm_users
    restart: on-failure

  request-service:
    build: core/request-service
    image: request-service
    depends_on:
      config-server:
        condition: service_healthy
      request-db:
        condition: service_healthy
    environment:
      - *java-opts
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://request-db:5432/ewm_requests
    restart: on-failure

  event-service:
    build: core/event-service
    image: event-service
    depends_on:
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
    environment:
      - *java-opts
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://ewm-db:5432/ewm
    restart: on-failure

  comment-service:
    build: core/comment-service
    image: comment-service
    depends_on:
      config-server:
        condition: service_healthy
      comment-db:
        condition: service_healthy
    environment:
      - *java-opts
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://comment-db:5432/ewm_comments
    restart: on-failure

  # ---------- Базы данных ----------
  stats-db:
    image: postgres:16.1
    container_name: postgres-ewm-stat-db
    ports:
      - "6541:5432"
    environment:
      - POSTGRES_PASSWORD=stat
      - POSTGRES_USER=stat
      - POSTGRES_DB=ewm-stats
    healthcheck: *db-healthcheck

  ewm-db:
    image: postgres:16.1
    container_name: postgres-ewm-db
    ports:
      - "6542:5432"
    environment:
      - POSTGRES_PASSWORD=ewm
      - POSTGRES_USER=ewm
      - POSTGRES_DB=ewm
    healthcheck: *db-healthcheck

  user-db:
    image: postgres:16.1
    ports:
      - "6543:5432"
    environment:
      - POSTGRES_PASSWORD=user
      - POSTGRES_USER=user
      - POSTGRES_DB=ewm_users
    healthcheck: *db-healthcheck

  request-db:
    image: postgres:16.1
    ports:
      - "6544:5432"
    environment:
      - POSTGRES_PASSWORD=request
      - POSTGRES_USER=request
      - POSTGRES_DB=ewm_requests
    healthcheck: *db-healthcheck

  comment-db:
    image: postgres:16.1
    ports:
      - "6545:5432"
    environment:
      - POSTGRES_PASSWORD=comment
      - POSTGRES_USER=comment
      - POSTGRES_DB=ewm_comments
    healthcheck: *db-healthcheck