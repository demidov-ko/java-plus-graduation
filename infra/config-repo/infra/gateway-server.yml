server:
  port: 8080


management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # ------------- Для отдельных сервисов -----------
          # -------- User Service -------
        - id: users-read
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: user-change
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

          # -------- Request Service -------
        - id: request-read
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests,/users/*/events/*/requests
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: request-change
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**,/users/*/events/*/requests

          # -------- Request Service -------
        - id: comment-read
          uri: lb://comment-service
          predicates:
            - Path=/events/*/comments/**,/admin/comments/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

        - id: comment-change
          uri: lb://comment-service
          predicates:
            - Path=/users/*/events/*/comments,/users/*/comments/**,/admin/comments/**

        # ---------- Admin: зона администратора ----------
        # GET-маршруты с Retry
        - id: admin-read
          uri: lb://event-service
          predicates:
#            - Path=/admin/users,/admin/events,/admin/categories,/admin/compilations
            - Path=/admin/events,/admin/categories,/admin/compilations
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        # Все остальные (POST/PATCH/DELETE)
        - id: admin-change
          uri: lb://event-service
          predicates:
            - Path=/admin/**

        # ---------- Private: зона авторизованного пользователя ----------
        - id: private-read
          uri: lb://event-service
          predicates:
#            - Path=/users/*/events,/users/*/events/*,/users/*/requests
            - Path=/users/*/events,/users/*/events/*
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: private-change
          uri: lb://event-service
          predicates:
            - Path=/users/**

        # ---------- Public: публичная зона ----------
        - id: public-read
          uri: lb://event-service
          predicates:
            - Path=/categories/**,/compilations/**,/events/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms


      globalcors:
        add-to-simple-url-handler-mapping: true
