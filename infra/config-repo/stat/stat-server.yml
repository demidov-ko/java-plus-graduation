server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:6541/ewm-stats
    username: stat
    password: stat
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

eureka:
  client:
    registry-fetch-interval-seconds: 5
