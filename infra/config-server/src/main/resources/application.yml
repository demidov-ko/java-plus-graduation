# Настройка native-хранилища (Config Server читает конфигурацию из локальной файловой системы)

server:
  port: 0    # задаёт случайны порт Config Server

spring:
  application:
    name: config-server
  profiles:
    active: native      # включает режим чтения конфигурации из файловой системы
  cloud:
    config:
      server:
        native:
          search-locations:   # указывает, где искать конфигурационные файлы
            # путь ./infra/config-repo означает: перейди из рабочей дериктории в поддиректорию infra, а затем в поддиректорию config-repo
            - file:${CONFIG_REPO_PATH:./infra/config-repo}
            - file:${CONFIG_REPO_PATH:./infra/config-repo}/core
            - file:${CONFIG_REPO_PATH:./infra/config-repo}/stat
            - file:${CONFIG_REPO_PATH:./infra/config-repo}/infra

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
